name: momentum25

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momentum25}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum25}
      POSTGRES_DB: ${POSTGRES_DB:-momentum25}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Limits keep the stack inside an 8 GB Docker VM next to test databases
    # (scripts/test-infra.sh). The three services together use at most 4.25 GB.
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum25}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API also serves the web app at http://localhost:${API_PORT} (ADR-013).
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
    env_file: .env
    environment:
      M25_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-momentum25}:${POSTGRES_PASSWORD:-momentum25}@db:5432/${POSTGRES_DB:-momentum25}
      M25_REDIS_URL: redis://redis:6379/0
      # Paths inside the image; they override any local-run values in .env.
      M25_STRATEGY_DIR: /app/strategies
      M25_WEB_DIST_DIR: /app/web
      # Wickstreet 2.0 (ADR-023): the runtime role, under row-level security (U3).
      WICKSTREET_DATABASE_URL: postgresql+asyncpg://wickstreet_app:${WICKSTREET_APP_DB_PASSWORD:-wickstreet_app}@db:5432/${POSTGRES_DB:-momentum25}
      # Personal mode binds every interface of the container and refuses to start
      # unless the published address below is loopback (U8).
      WICKSTREET_BIND_HOST: 0.0.0.0
      WICKSTREET_IN_CONTAINER: "true"
      WICKSTREET_PUBLISHED_BIND: ${APP_BIND:-127.0.0.1}
      # The 11:30 IST MF refresh runs in this process (ADR-022 §2.12).
      WICKSTREET_REFRESH_ENABLED: ${WICKSTREET_REFRESH_ENABLED:-true}
      # Raw source files live on the host at the path the CLI uses, so every
      # revision's raw_path resolves from both (ADR-017 MF-9).
      WICKSTREET_RAW_DIR: ${WICKSTREET_RAW_DIR:-${HOME}/.wickstreet/raw}
    volumes:
      - ${WICKSTREET_RAW_DIR:-${HOME}/.wickstreet/raw}:${WICKSTREET_RAW_DIR:-${HOME}/.wickstreet/raw}
    # Loopback only. APP_BIND=0.0.0.0 exposes an unauthenticated app to the LAN;
    # that instance is not secure, and every reachable browser has full access.
    # Use an authenticating proxy for network exposure and list its host in M25_ALLOWED_HOSTS.
    ports:
      - "${APP_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      wickstreet-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    # Runs Momentum25 migrations, then starts the host that serves Momentum25 at /
    # and Wickstreet 2.0 at /api/v1/mf (ADR-023 U1). Override for production.
    command: ["sh", "-c", "alembic upgrade head && python -m apphost"]

  # Wickstreet 2.0 database setup, a step of its own (ADR-023 U3, A3 §7.3): creates
  # the wickstreet_owner and wickstreet_app roles and the wickstreet schema, then
  # runs the MF migrations as the owner. It changes no Momentum25 table.
  wickstreet-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
    env_file: .env
    environment:
      WICKSTREET_ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-momentum25}:${POSTGRES_PASSWORD:-momentum25}@db:5432/${POSTGRES_DB:-momentum25}
      WICKSTREET_MIGRATION_DATABASE_URL: postgresql+asyncpg://wickstreet_owner:${WICKSTREET_OWNER_DB_PASSWORD:-wickstreet_owner}@db:5432/${POSTGRES_DB:-momentum25}
      WICKSTREET_DATABASE_URL: postgresql+asyncpg://wickstreet_app:${WICKSTREET_APP_DB_PASSWORD:-wickstreet_app}@db:5432/${POSTGRES_DB:-momentum25}
      WICKSTREET_PUBLISHED_BIND: ${APP_BIND:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    command: ["sh", "-c", "wickstreet db-roles && alembic -c alembic-wickstreet.ini upgrade head"]

  # ---- Development tooling (profile: dev) ----
  adminer:
    image: adminer:4
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
