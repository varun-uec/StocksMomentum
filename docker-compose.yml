name: momentum25

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momentum25}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum25}
      POSTGRES_DB: ${POSTGRES_DB:-momentum25}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum25}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API also serves the web app at http://localhost:${API_PORT} (ADR-013).
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
    env_file: .env
    environment:
      M25_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-momentum25}:${POSTGRES_PASSWORD:-momentum25}@db:5432/${POSTGRES_DB:-momentum25}
      M25_REDIS_URL: redis://redis:6379/0
      # Paths inside the image; they override any local-run values in .env.
      M25_STRATEGY_DIR: /app/strategies
      M25_WEB_DIST_DIR: /app/web
    # Loopback only. APP_BIND=0.0.0.0 exposes an unauthenticated app to the LAN;
    # that instance is not secure, and every reachable browser has full access.
    # Use an authenticating proxy for network exposure and list its host in M25_ALLOWED_HOSTS.
    ports:
      - "${APP_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runs migrations then starts the API. Override for production.
    command: ["sh", "-c", "alembic upgrade head && uvicorn momentum25.main:app --host 0.0.0.0 --port 8000"]

  # ---- Development tooling (profile: dev) ----
  adminer:
    image: adminer:4
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
