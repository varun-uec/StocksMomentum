name: momentum25

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-momentum25}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum25}
      POSTGRES_DB: ${POSTGRES_DB:-momentum25}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-momentum25}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      M25_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-momentum25}:${POSTGRES_PASSWORD:-momentum25}@db:5432/${POSTGRES_DB:-momentum25}
      M25_REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Runs migrations then starts the API. Override for production.
    command: ["sh", "-c", "alembic upgrade head && uvicorn momentum25.main:app --host 0.0.0.0 --port 8000"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # ---- Development tooling (profile: dev) ----
  adminer:
    image: adminer:4
    profiles: ["dev"]
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    profiles: ["dev"]
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    depends_on:
      - redis

volumes:
  pgdata:
  redisdata:
