# Wickstreet 2.0 MF migrations (ADR-023 U3, OM-12): their own environment and
# version table. Run as wickstreet_owner, as a step of its own:
#   alembic -c alembic-wickstreet.ini upgrade head
# The URL comes from WICKSTREET_MIGRATION_DATABASE_URL.
[alembic]
script_location = src/wickstreet/persistence/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
