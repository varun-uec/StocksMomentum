[project]
name = "momentum25"
version = "0.1.0"
description = "Momentum25 India — deterministic, explainable momentum stock screener (backend)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "apscheduler>=3.10",
    "numpy>=2.0",
    "tenacity>=9.0",
    "pandas>=2.2",
    "nsemine>=1.5",
    "prometheus-client>=0.20",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "syrupy>=4.6",
]

[project.scripts]
momentum25 = "momentum25.interface.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum25"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/momentum25/infrastructure/persistence/migrations/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "pandas",
    "pandas.*",
    "nsemine",
    "nsemine.*",
    "prometheus_client",
    "exchange_calendars",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
env = [
    # "D:" = default-only: an M25_DATABASE_URL already present in the environment
    # wins. Without it the suite is pinned to host port 5432, which is not free on
    # every developer machine (another project may own it), making the 38 integration
    # tests unrunnable rather than merely differently-configured.
    "D:M25_DATABASE_URL=postgresql+asyncpg://momentum25:momentum25@localhost:5432/momentum25_test",
]

[tool.importlinter]
root_package = "momentum25"

[[tool.importlinter.contracts]]
name = "Clean architecture layering (dependencies point inward)"
type = "layers"
layers = [
    "momentum25.interface",
    "momentum25.application",
    "momentum25.domain",
]
# infrastructure implements ports; it may import domain/application but not interface.
[[tool.importlinter.contracts]]
name = "Domain is pure (no infrastructure/interface/application imports)"
type = "forbidden"
source_modules = ["momentum25.domain"]
forbidden_modules = [
    "momentum25.infrastructure",
    "momentum25.interface",
    "momentum25.application",
]

[dependency-groups]
dev = [
    "pytest-env>=1.6.0",
]
