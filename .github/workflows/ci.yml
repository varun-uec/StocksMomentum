name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Ruff lint
        run: uv run ruff check src tests
      - name: mypy typecheck
        run: uv run mypy src
      - name: Architecture contracts
        run: uv run lint-imports

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: momentum25
          POSTGRES_PASSWORD: momentum25
          POSTGRES_DB: momentum25_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term
        env:
          M25_DATABASE_URL: postgresql+asyncpg://momentum25:momentum25@localhost:5432/momentum25_test
          M25_REDIS_URL: redis://localhost:6379/0
          M25_ENVIRONMENT: test
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  migrations:
    name: Migrations match the models (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: momentum25
          POSTGRES_PASSWORD: momentum25
          POSTGRES_DB: momentum25_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      M25_DATABASE_URL: postgresql+asyncpg://momentum25:momentum25@localhost:5432/momentum25_migrations
      M25_ENVIRONMENT: test
      WICKSTREET_ADMIN_DATABASE_URL: postgresql+asyncpg://momentum25:momentum25@localhost:5432/momentum25_migrations
      WICKSTREET_MIGRATION_DATABASE_URL: postgresql+asyncpg://wickstreet_owner:wickstreet_owner@localhost:5432/momentum25_migrations
      WICKSTREET_DATABASE_URL: postgresql+asyncpg://wickstreet_app:wickstreet_app@localhost:5432/momentum25_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras --frozen
      - name: Migrate an empty database to head
        run: uv run alembic upgrade head
      - name: Fail if the models differ from the migrations
        run: uv run alembic check
      # Wickstreet 2.0: own roles, schema and Alembic environment (ADR-023 U3, OM-12).
      - name: Create the MF roles and schema
        run: uv run wickstreet db-roles
      - name: Migrate the MF schema to head as its owner
        run: uv run alembic -c alembic-wickstreet.ini upgrade head
      - name: Fail if the MF models differ from the MF migrations
        run: uv run alembic -c alembic-wickstreet.ini check

  lint-web:
    name: Lint (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  build-web:
    name: Build (Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
  api-types:
    name: API types match the backend (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install uv
      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --all-extras --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json
      - name: Regenerate the web client's API types
        working-directory: ./web
        run: npm ci && npm run gen:api
      - name: Fail if the committed types are stale
        run: git diff --exit-code web/src/lib/api-schema.ts
