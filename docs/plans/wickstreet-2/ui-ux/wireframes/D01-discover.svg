f" font-size="10" fill="#53675e" font-weight="600">DESIGN WIREFRAME · not a running application</text><text x="765" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Reference: 22 Oct 2026 · v5 · r2801   |   Curves schematic</text><rect x="240" y="218" width="1144" height="220" rx="16" fill="#e3efe7" stroke="#e3efe7"/><text x="270" y="254" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">RESEARCH WITH INTENTION</text><text x="270" y="301" font-family="Georgia,serif" font-size="31" fill="#172d27" font-weight="400">Make your next investment</text><text x="270" y="340" font-family="Georgia,serif" font-size="31" fill="#172d27" font-weight="400">a considered one.</text><text x="270" y="375" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">Go beyond the last return. Understand consistency, risk and the journey.</text><rect x="1005" y="270" width="345" height="42" rx="7" fill="#176b55" stroke="#176b55"/><text x="1021" y="297" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600">Explore consistent funds</text><rect x="1005" y="325" width="345" height="42" rx="7" fill="#ffffff" stroke="#d6ded5"/><text x="1021" y="352" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Build my own screen</text><text x="1005" y="399" font-family="Inter,Arial,sans-serif" font-size="11" fill="#176b55" font-weight="400">01  Choose a question → inspect its evidence</text><text x="240" y="481" font-family="Georgia,serif" font-size="22" fill="#172d27" font-weight="400">A thoughtful starting point</text><text x="1170" y="479" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">All collections  →</text><rect x="240" y="503" width="366" height="205" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="535" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Consistent large caps</text><text x="262" y="568" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">CONSISTENCY, FIRST</text><text x="262" y="598" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">Rolling 3Y returns above the category</text><text x="262" y="621" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">median in at least 70% of months.</text><text x="262" y="681" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Inspect this screen  →</text><rect x="629" y="503" width="366" height="205" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="651" y="535" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Calm equity</text><text x="651" y="568" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">A CALMER EQUITY JOURNEY</text><text x="651" y="598" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">Above-median return, with volatility in</text><text x="651" y="621" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">the calmer half of its category.</text><text x="651" y="681" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Inspect this screen  →</text><rect x="1018" y="503" width="366" height="205" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="1040" y="535" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Ten-year compounders</text><text x="1040" y="568" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">STAY WITH THE EVIDENCE</text><text x="1040" y="598" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">Long-history funds screened on returns and</text><text x="1040" y="621" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">positive calendar years.</text><text x="1040" y="681" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Inspect this screen  →</text><rect x="240" y="736" width="555" height="233" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="768" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Explore by category</text><text x="262" y="791" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Select a category to open its exact universe</text><rect x="262" y="815" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="274" y="835" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Large cap</text><rect x="432" y="815" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="444" y="835" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Flexi cap</text><rect x="602" y="815" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="614" y="835" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Mid cap</text><rect x="262" y="868" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="274" y="888" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Hybrid</text><rect x="432" y="868" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="444" y="888" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Liquid</text><rect x="602" y="868" width="155" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="614" y="888" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Index funds</text><rect x="819" y="736" width="565" height="233" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="841" y="768" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Your research, ready to resume</text><text x="841" y="791" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Personal workspace service · planned M6</text><text x="843" y="826" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">Start with a saved screen or decision brief. Your</text><text x="843" y="849" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">reasoning and original evidence stay together.</text><rect x="843" y="893" width="244" height="42" rx="7" fill="#ffffff" stroke="#d6ded5"/><text x="859" y="920" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">See workspace design</text></svg>