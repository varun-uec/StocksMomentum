<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">D10 · Mobile research loop · desktop</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="1060" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><rect x="0" y="0" width="208" height="1060" rx="0" fill="#ffffff" stroke="#d6ded5"/><text x="25" y="48" font-family="Georgia,serif" font-size="26" fill="#172d27" font-weight="700">wickstreet.</text><text x="25" y="72" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">THE RESEARCH NOTEBOOK</text><rect x="20" y="99" width="168" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="32" y="119" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Mutual funds  ▾</text><text x="29" y="164" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Discover</text><text x="29" y="215" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Screen</text><text x="29" y="266" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Studio</text><text x="29" y="317" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Compare</text><text x="29" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Simulate</text><text x="29" y="419" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Workspace</text><path d="M24 484L184 484" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="28" y="516" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">COMPLETE VISION</text><text x="28" y="551" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Portfolio   /  Slice 6</text><text x="28" y="588" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Research agent / Slice 5</text><text x="25" y="935" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">↗ Momentum25 · Stocks</text><text x="25" y="963" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Local personal workspace</text><text x="25" y="990" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="400">Light  /  Dark</text><rect x="208" y="0" width="1232" height="76" rx="0" fill="#f6f5f0" stroke="#d6ded5"/><rect x="240" y="18" width="644" height="40" rx="8" fill="#ffffff" stroke="#d6ded5"/><text x="257" y="44" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">⌕  Search a fund or ask a research question…</text><rect x="1112" y="24" width="132" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1124" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Personal · local</text><rect x="1256" y="24" width="104" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1268" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Ask  ↗</text><text x="240" y="110" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">WICKSTREET 2.0  /  MOBILE RESEARCH LOOP</text><text x="240" y="154" font-family="Georgia,serif" font-size="34" fill="#172d27" font-weight="400">A workstation in your hand</text><text x="240" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Design · responsive shell and context continuity</text><text x="240" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="600">DESIGN WIREFRAME · not a running application</text><text x="765" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Reference: 22 Oct 2026 · v5 · r2801   |   Curves schematic</text><rect x="240" y="214" width="1144" height="123" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="246" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">One research context, every screen</text><text x="262" y="269" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Desktop, tablet and phone preserve the same selected funds, revision, view and return path.</text><text x="265" y="300" font-family="Georgia,serif" font-size="23" fill="#172d27" font-weight="400">Search → fund → risk → compare → scenario → brief</text><rect x="240" y="362" width="366" height="234" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="394" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">1. Search</text><text x="263" y="430" font-family="Inter,Arial,sans-serif" font-size="19" fill="#53675e" font-weight="400">Exact plan-option and status</text><text x="263" y="498" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">No hover-only controls. Back restores</text><text x="263" y="521" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">context and focus.</text><rect x="629" y="362" width="366" height="234" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="651" y="394" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">2. Inspect</text><text x="652" y="430" font-family="Inter,Arial,sans-serif" font-size="19" fill="#53675e" font-weight="400">One readable chart at a time</text><text x="652" y="498" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">No hover-only controls. Back restores</text><text x="652" y="521" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">context and focus.</text><rect x="1018" y="362" width="366" height="234" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="1040" y="394" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">3. Act</text><text x="1041" y="430" font-family="Inter,Arial,sans-serif" font-size="19" fill="#53675e" font-weight="400">Sticky actions, reserved safe</text><text x="1041" y="453" font-family="Inter,Arial,sans-serif" font-size="19" fill="#53675e" font-weight="400">area</text><text x="1041" y="498" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">No hover-only controls. Back restores</text><text x="1041" y="521" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">context and focus.</text><rect x="240" y="622" width="743" height="343" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="654" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Tablet adapts the layout, not the evidence</text><text x="262" y="677" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">768–1279 px: collapsed rail, filter drawer and overlay research panel</text><rect x="266" y="709" width="691" height="195" rx="10" fill="#f6f5f0" stroke="#d6ded5"/><rect x="280" y="724" width="48" height="164" rx="7" fill="#e3efe7" stroke="#d6ded5"/><rect x="343" y="724" width="375" height="164" rx="7" fill="#ffffff" stroke="#d6ded5"/><rect x="732" y="724" width="210" height="164" rx="7" fill="#e3efe7" stroke="#d6ded5"/><text x="365" y="773" font-family="Inter,Arial,sans-serif" font-size="17" fill="#172d27" font-weight="600">Primary chart</text><text x="752" y="773" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172d27" font-weight="400">Evidence</text><text x="365" y="820" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">One shared revision</text><rect x="1007" y="622" width="377" height="343" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="1029" y="654" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Phone interaction rules</text><text x="1031" y="702" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">Apply / Cancel in filters. Pin</text><text x="1031" y="725" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">tooltips by tap. Compare two focus</text><text x="1031" y="748" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">funds. Put More above the safe area.</text><text x="1031" y="771" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">Keep keyboard and screen-reader</text><text x="1031" y="794" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">access equal.</text><text x="1031" y="927" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">See the paired mobile artboard →</text></svg>