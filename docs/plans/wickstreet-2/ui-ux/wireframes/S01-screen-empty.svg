<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">D02 · Screen · desktop</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="1060" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><rect x="0" y="0" width="208" height="1060" rx="0" fill="#ffffff" stroke="#d6ded5"/><text x="25" y="48" font-family="Georgia,serif" font-size="26" fill="#172d27" font-weight="700">wickstreet.</text><text x="25" y="72" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">THE RESEARCH NOTEBOOK</text><rect x="20" y="99" width="168" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="32" y="119" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Mutual funds  ▾</text><text x="29" y="164" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Discover</text><rect x="14" y="188" width="180" height="43" rx="7" fill="#e3efe7" stroke="#e3efe7"/><text x="29" y="215" font-family="Inter,Arial,sans-serif" font-size="15" fill="#176b55" font-weight="600">Screen</text><text x="29" y="266" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Studio</text><text x="29" y="317" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Compare</text><text x="29" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Simulate</text><text x="29" y="419" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Workspace</text><path d="M24 484L184 484" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="28" y="516" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">COMPLETE VISION</text><text x="28" y="551" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Portfolio   /  Slice 6</text><text x="28" y="588" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Research agent / Slice 5</text><text x="25" y="935" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">↗ Momentum25 · Stocks</text><text x="25" y="963" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Local personal workspace</text><text x="25" y="990" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="400">Light  /  Dark</text><rect x="208" y="0" width="1232" height="76" rx="0" fill="#f6f5f0" stroke="#d6ded5"/><rect x="240" y="18" width="644" height="40" rx="8" fill="#ffffff" stroke="#d6ded5"/><text x="257" y="44" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">⌕  Search a fund or ask a research question…</text><rect x="1112" y="24" width="132" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1124" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Personal · local</text><rect x="1256" y="24" width="104" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1268" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Ask  ↗</text><text x="240" y="110" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">WICKSTREET 2.0  /  SCREEN</text><text x="240" y="154" font-family="Georgia,serif" font-size="34" fill="#172d27" font-weight="400">Turn a thesis into a shortlist</text><text x="240" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Available APIs · 160 fields, formulas, conditions</text><text x="240" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="600">DESIGN WIREFRAME · not a running application</text><text x="765" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Reference: 22 Oct 2026 · v5 · r2801   |   Curves schematic</text><text x="240" y="238" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">STATE STUDY / EMPTY, NOT AN ERROR</text><rect x="240" y="274" width="1144" height="253" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="306" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">No funds match every condition</text><text x="262" y="329" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Show this only after a successful screen response.</text><text x="266" y="362" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">Keep the exact rules visible. Offer only the relaxation paths and counts returned by the backend; this</text><text x="266" y="385" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">wireframe invents no result count.</text><rect x="266" y="449" width="210" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="278" y="469" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Edit condition</text><rect x="492" y="449" width="333" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="504" y="469" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Apply returned relaxation</text><rect x="240" y="552" width="550" height="359" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="584" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">A failed request is different</text><text x="266" y="634" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">Research could not update. Preserve the prior</text><text x="266" y="657" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">screen, mark it as previous results, show the</text><text x="266" y="680" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">server reason and offer Retry.</text><rect x="266" y="802" width="270" height="42" rx="7" fill="#176b55" stroke="#176b55"/><text x="282" y="829" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600">Retry research read</text><rect x="814" y="552" width="570" height="359" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="836" y="584" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Missing is not zero</text><text x="840" y="634" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">NA: not available, with reason. NM: not meaningful,</text><text x="840" y="657" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">with reason. Every comparison on either fails,</text><text x="840" y="680" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">including != and not_in. Use is_missing to include</text><text x="840" y="703" font-family="Inter,Arial,sans-serif" font-size="18" fill="#53675e" font-weight="400">it.</text></svg>