size="16" fill="#53675e" font-weight="400">Fund identity, exact CAGR, volatility,</text><text x="1026" y="314" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">peer key and revision arrive from</text><text x="1026" y="337" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">/peers/frontier. The marked set is</text><text x="1026" y="360" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">non-dominated historically; it is not</text><text x="1026" y="383" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">a personal optimum.</text><rect x="1026" y="494" width="330" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1038" y="514" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Open fund / data table</text><rect x="240" y="607" width="554" height="360" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="639" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Did leaders stay leaders?</text><text x="262" y="662" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">SCHEMATIC · 12-month transition shares, labels supplied by API</text><rect x="323" y="698" width="69" height="43" rx="4" fill="#e3efe7" stroke="#ffffff"/><rect x="401" y="698" width="69" height="43" rx="4" fill="#c6ddcd" stroke="#ffffff"/><rect x="479" y="698" width="69" height="43" rx="4" fill="#9dc3ad" stroke="#ffffff"/><rect x="557" y="698" width="69" height="43" rx="4" fill="#689c82" stroke="#ffffff"/><text x="268" y="726" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Q1</text><rect x="323" y="752" width="69" height="43" rx="4" fill="#c6ddcd" stroke="#ffffff"/><rect x="401" y="752" width="69" height="43" rx="4" fill="#9dc3ad" stroke="#ffffff"/><rect x="479" y="752" width="69" height="43" rx="4" fill="#689c82" stroke="#