<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1120" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc"><title id="title">M07 · Portfolio intelligence · mobile</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="390" height="1120" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><text x="18" y="34" font-family="Georgia,serif" font-size="23" fill="#172d27" font-weight="700">wickstreet.</text><text x="296" y="33" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">MF  ▾</text><path d="M0 53L390 53" fill="none" stroke="#d6ded5" stroke-dasharray=""/><rect x="16" y="69" width="358" height="43" rx="8" fill="#ffffff" stroke="#d6ded5"/><text x="30" y="96" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">⌕  Search or ask about a fund…</text><text x="16" y="140" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">07  PORTFOLIO INTELLIGENCE</text><text x="16" y="176" font-family="Inter,Arial,sans-serif" font-size="25" fill="#172d27" font-weight="400">Look through to what you</text><text x="16" y="206" font-family="Inter,Arial,sans-serif" font-size="25" fill="#172d27" font-weight="400">own</text><path d="M0 1034L390 1034" fill="none" stroke="#d6ded5" stroke-dasharray=""/><rect x="0" y="1035" width="390" height="85" rx="0" fill="#ffffff" stroke="#ffffff"/><text x="15" y="1076" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">Discover</text><text x="111" y="1076" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">Screen</text><text x="207" y="1076" font-family="Inter,Arial,sans-serif" font-size="11" fill="#176b55" font-weight="600">Portfolio</text><text x="303" y="1076" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">More</text><text x="16" y="1105" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="400">PLANNING ONLY · 390 px · safe area reserved</text><rect x="16" y="224" width="358" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="28" y="244" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">PLANNED · SLICE 6</text><rect x="16" y="278" width="358" height="304" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="38" y="310" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Your CAS stays local</text><text x="35" y="347" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">Choose a statement. Enter a one-use</text><text x="35" y="370" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">password. Review parsed transactions</text><text x="35" y="393" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">before anything enters your</text><text x="35" y="416" font-family="Inter,Arial,sans-serif" font-size="16" fill="#53675e" font-weight="400">portfolio.</text><rect x="35" y="461" width="320" height="42" rx="7" fill="#176b55" stroke="#176b55"/><text x="51" y="488" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600">Choose local file</text><text x="35" y="549" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Design only · parser not yet built</text><rect x="16" y="604" width="358" height="255" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="38" y="636" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Preview before commit</text><text x="35" y="675" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172d27" font-weight="400">01  Parse and identify exact plans</text><text x="35" y="724" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172d27" font-weight="400">02  Review duplicates and issues</text><text x="35" y="773" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172d27" font-weight="400">03  Reconcile, then commit</text><text x="35" y="823" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">Undo import by batch</text><rect x="16" y="881" width="358" height="124" rx="10" fill="#f6f5f0" stroke="#d6ded5"/><text x="34" y="907" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3c6380" font-weight="600">PLANNED SERVICE / DATA</text><text x="34" y="934" font-family="Inter,Arial,sans-serif" font-size="17" fill="#172d27" font-weight="600">Ledger + E1 / E4</text><text x="34" y="960" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Value, XIRR and exposure wait for real</text><text x="34" y="983" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">reconciled inputs.</text></svg>