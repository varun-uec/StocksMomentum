"600">COMPLETE VISION</text><text x="28" y="551" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Portfolio   /  Slice 6</text><text x="28" y="588" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Research agent / Slice 5</text><text x="25" y="935" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">↗ Momentum25 · Stocks</text><text x="25" y="963" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Local personal workspace</text><text x="25" y="990" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="400">Light  /  Dark</text><rect x="208" y="0" width="1232" height="76" rx="0" fill="#f6f5f0" stroke="#d6ded5"/><rect x="240" y="18" width="644" height="40" rx="8" fill="#ffffff" stroke="#d6ded5"/><text x="257" y="44" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">⌕  Search a fund or ask a research question…</text><rect x="1112" y="24" width="132" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1124" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Personal · local</text><rect x="1256" y="24" width="104" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1268" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Ask  ↗</text><text x="240" y="110" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">WICKSTREET 2.0  /  PORTFOLIO INTELLIGENCE</text><text x="240" y="154" font-family="Georgia,serif" font-size="34" fill="#172d27" font-weight="400">Look through to what you own</text><text x="240" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Planned · Slice 6 ledger + E1 / E4</text><text x="240" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="600">DESIGN WIREFRAME · not a running application</text><text x="765" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Reference: 22 Oct 2026 · v5 · r2801   |   Curves schematic</text><rect x="240" y="214" width="1144" height="98" rx="12" fill="#e3efe7" stroke="#e3efe7"/><text x="264" y="250" font-family="Inter,Arial,sans-serif" font-size="11" fill="#176b55" font-weight="600">YOUR DATA STAYS ON YOUR MACHINE</text><text x="264" y="281" font-family="Inter,Arial,sans-serif" font-size="19" fill="#172d27" font-weight="600">Local CAS → preview → reconcile → commit → review</text><rect x="1120" y="245" width="235" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1132" y="265" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Planned Slice 6</text><rect x="240" y="336" width="1144" height="214" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Start with your consolidated statement</text><text x="262" y="391" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Complete-vision design · no parser or portfolio response is simulated</text><rect x="266" y="418" width="290" height="42" rx="7" fill="#176b55" stroke="#176b55"/><text x="282" y="445" font-family="Inter,Arial,sans-serif" font-size="13" fill="#ffffff" font-weight="600">Choose local CAS file</text><rect x="577" y="418" width="300" height="42" rx="7" fill="#ffffff" stroke="#d6ded5"/><text x="593" y="445" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">View import requirements</text><text x="266" y="498" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">One-use password. Raw file never goes to an AI provider. Only reviewed transactions enter the local ledger.</text><rect x="240" y="575" width="551" height="237" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="607" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Where your money is invested</text><text x="262" y="630" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Exposure view waits for a reconciled portfolio</text><rect x="266" y="658" width="493" height="36" rx="5" fill="#f6f5f0" stroke="#d6ded5"/><text x="280" y="682" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Known exposure  |  Unresolved  |  Unreported</text><text x="266" y="737" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">Disclosure dates, publication dates and residual weights stay</text><text x="266" y="760" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">visible.</text><rect x="815" y="575" width="569" height="237" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="837" y="607" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Allocation is a scenario</text><text x="837" y="630" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Proposed target versus current allocation</text><text x="840" y="662" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Set constraints. Inspect costs and missing data. Review a</text><text x="840" y="685" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">proposed rebalance without placing an order.</text><rect x="240" y="836" width="1144" height="135" rx="10" fill="#f6f5f0" stroke="#d6ded5"/><text x="258" y="862" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3c6380" font-weight="600">PLANNED SERVICE / DATA</text><text x="258" y="889" font-family="Inter,Arial,sans-serif" font-size="17" fill="#172d27" font-weight="600">Ledger + portfolio methods + E1 / E4</text><text x="258" y="915" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Import preview and reconciliation precede value, XIRR, overlap and look-through. No sample wealth or fund weights are shown.</text></svg>