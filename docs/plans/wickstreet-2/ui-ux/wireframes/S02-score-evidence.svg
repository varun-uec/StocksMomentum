<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">D03 · Fund intelligence · desktop</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="1060" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><rect x="0" y="0" width="208" height="1060" rx="0" fill="#ffffff" stroke="#d6ded5"/><text x="25" y="48" font-family="Georgia,serif" font-size="26" fill="#172d27" font-weight="700">wickstreet.</text><text x="25" y="72" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">THE RESEARCH NOTEBOOK</text><rect x="20" y="99" width="168" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="32" y="119" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Mutual funds  ▾</text><rect x="14" y="137" width="180" height="43" rx="7" fill="#e3efe7" stroke="#e3efe7"/><text x="29" y="164" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Discover</text><text x="29" y="215" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Screen</text><text x="29" y="266" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Studio</text><text x="29" y="317" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Compare</text><text x="29" y="368" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Simulate</text><text x="29" y="419" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Workspace</text><path d="M24 484L184 484" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="28" y="516" font-family="Inter,Arial,sans-serif" font-size="9" fill="#53675e" font-weight="600">COMPLETE VISION</text><text x="28" y="551" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Portfolio   /  Slice 6</text><text x="28" y="588" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3c6380" font-weight="400">Research agent / Slice 5</text><text x="25" y="935" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">↗ Momentum25 · Stocks</text><text x="25" y="963" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Local personal workspace</text><text x="25" y="990" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="400">Light  /  Dark</text><rect x="208" y="0" width="1232" height="76" rx="0" fill="#f6f5f0" stroke="#d6ded5"/><rect x="240" y="18" width="644" height="40" rx="8" fill="#ffffff" stroke="#d6ded5"/><text x="257" y="44" font-family="Inter,Arial,sans-serif" font-size="14" fill="#53675e" font-weight="400">⌕  Search a fund or ask a research question…</text><rect x="1112" y="24" width="132" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1124" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Personal · local</text><rect x="1256" y="24" width="104" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1268" y="44" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Ask  ↗</text><text x="240" y="110" font-family="Inter,Arial,sans-serif" font-size="10" fill="#176b55" font-weight="600">WICKSTREET 2.0  /  FUND INTELLIGENCE</text><text x="240" y="154" font-family="Georgia,serif" font-size="34" fill="#172d27" font-weight="400">Understand the whole picture</text><text x="240" y="184" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Available APIs · NAV, metrics, score, risk, peers</text><text x="240" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="600">DESIGN WIREFRAME · not a running application</text><text x="765" y="1026" font-family="Inter,Arial,sans-serif" font-size="10" fill="#53675e" font-weight="400">Reference: 22 Oct 2026 · v5 · r2801   |   Curves schematic</text><rect x="240" y="221" width="709" height="721" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="262" y="253" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Why 97.78 / 100?</text><text x="262" y="276" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">Parag Parikh Direct Growth · r2801 · equal-weight category percentiles</text><rect x="263" y="319" width="663" height="38" rx="5" fill="#e3efe7" stroke="#e3efe7"/><text x="275" y="344" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">Part</text><text x="605" y="344" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">Percentile</text><text x="805" y="344" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">Weight</text><path d="M263 428L926 428" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="275" y="388" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">Consistency 3Y</text><text x="605" y="388" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">93.33 / 100</text><text x="805" y="388" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">1 / 3</text><path d="M263 499L926 499" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="275" y="459" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">Return per risk 3Y</text><text x="605" y="459" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">100 / 100</text><text x="805" y="459" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">1 / 3</text><path d="M263 570L926 570" fill="none" stroke="#d6ded5" stroke-dasharray=""/><text x="275" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#176b55" font-weight="600">Max drawdown 3Y</text><text x="605" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">100 / 100</text><text x="805" y="530" font-family="Inter,Arial,sans-serif" font-size="12" fill="#172d27" font-weight="400">1 / 3</text><text x="266" y="635" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">The three parts use 31, 36 and 36 ranked peers respectively. A</text><text x="266" y="658" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">missing part makes the score unavailable. The score is not a</text><text x="266" y="681" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">personalised suitability assessment.</text><text x="266" y="785" font-family="Inter,Arial,sans-serif" font-size="16" fill="#84581e" font-weight="600">Not included: TER, Sharpe, holdings quality</text><text x="266" y="823" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">No penalties or data-quality notes were returned for this reference score.</text><text x="266" y="846" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">That is not a guarantee.</text><rect x="973" y="221" width="411" height="721" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="995" y="253" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Evidence and limits</text><text x="997" y="306" font-family="Inter,Arial,sans-serif" font-size="25" fill="#a64340" font-weight="600">1Y return −5.69%</text><text x="997" y="356" font-family="Inter,Arial,sans-serif" font-size="23" fill="#172d27" font-weight="600">Score rank 1 of 31</text><text x="997" y="418" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">Both are true at this snapshot. High</text><text x="997" y="441" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">historical rank does not eliminate</text><text x="997" y="464" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">recent loss or predict future</text><text x="997" y="487" font-family="Inter,Arial,sans-serif" font-size="17" fill="#53675e" font-weight="400">performance.</text><text x="997" y="570" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">Sources AMFI / RBI / TigZig. Current</text><text x="997" y="593" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">category labels applied historically. First</text><text x="997" y="616" font-family="Inter,Arial,sans-serif" font-size="15" fill="#53675e" font-weight="400">stored NAV is not inception.</text><rect x="997" y="775" width="355" height="30" rx="6" fill="#ffffff" stroke="#d6ded5"/><text x="1009" y="795" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="600">Open source coverage</text></svg>