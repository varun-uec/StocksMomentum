<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1150" viewBox="0 0 1440 1150" role="img" aria-labelledby="title desc"><title id="title">CAS import and agent evidence boundaries</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="1150" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><text x="40" y="52" font-family="Georgia,serif" font-size="36" fill="#172d27" font-weight="400">Trust is a visible workflow</text><text x="40" y="85" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">COMPLETE VISION · proposed interactions · Slice 5 / 6 services remain unbuilt</text><rect x="40" y="122" width="640" height="100" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="60" y="154" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">CAS / portfolio lane · Slice 6</text><text x="60" y="183" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Raw file and password stay local. No file enters agent context.</text><rect x="760" y="122" width="640" height="100" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="780" y="154" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">Research agent lane · Slice 5</text><text x="780" y="183" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Local model; typed tools and response validation under ADR-022.</text><rect x="40" y="263" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">1  Choose file and one-use password</text><text x="60" y="324" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Wrong password or unsupported format → retry, no ledger changes.</text><rect x="760" y="263" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="780" y="295" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">1  Question + public research context</text><text x="780" y="324" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Language, selected plans, window, revision. No raw CAS or credentials.</text><path d="M360 408L360 450" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M355 442 L360 450 L365 442" fill="none" stroke="#176b55" stroke-width="2"/><path d="M1080 408L1080 450" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M1075 442 L1080 450 L1085 442" fill="none" stroke="#176b55" stroke-width="2"/><rect x="40" y="450" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="482" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">2  Parse-only preview</text><text x="60" y="511" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Resolve exact plans; inspect duplicates, missing records and balance reconciliation.</text><rect x="760" y="450" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="780" y="482" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">2  Rights-checked deterministic tools</text><text x="780" y="511" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Read facts or build a view. Missing capability returns a named dependency.</text><path d="M360 595L360 637" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M355 629 L360 637 L365 629" fill="none" stroke="#176b55" stroke-width="2"/><path d="M1080 595L1080 637" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M1075 629 L1080 637 L1085 629" fill="none" stroke="#176b55" stroke-width="2"/><rect x="40" y="637" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="669" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">3  Explicit idempotent commit</text><text x="60" y="698" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Blocking issues resolved; tenant-owned ledger; undo import batch.</text><rect x="760" y="637" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="780" y="669" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">3  Validate before displaying claims</text><text x="780" y="698" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Unsupported number/entity/date → authoritative template fallback.</text><path d="M360 782L360 824" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M355 816 L360 824 L365 816" fill="none" stroke="#176b55" stroke-width="2"/><path d="M1080 782L1080 824" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M1075 816 L1080 824 L1085 816" fill="none" stroke="#176b55" stroke-width="2"/><rect x="40" y="824" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="856" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">4  Portfolio views and scenarios</text><text x="60" y="885" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Value/XIRR/unknowns; E4 dated look-through; proposed allocation, no order.</text><rect x="760" y="824" width="640" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="780" y="856" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">4  Open evidence or save previewed change</text><text x="780" y="885" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Shared view spec opens editable research. Persist exact answer and tool evidence.</text><text x="42" y="1072" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Portfolio tools require a later permitted derived-data boundary; they are not enabled merely because the agent UI exists.</text></svg>