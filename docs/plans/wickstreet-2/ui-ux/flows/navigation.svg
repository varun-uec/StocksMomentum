<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Navigation map · MF workspace beside preserved Momentum25</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><text x="40" y="54" font-family="Georgia,serif" font-size="36" fill="#172d27" font-weight="400">One notebook. Connected research.</text><text x="40" y="87" font-family="Inter,Arial,sans-serif" font-size="12" fill="#53675e" font-weight="400">PROPOSED INFORMATION ARCHITECTURE · existing stock URLs retain their meaning</text><rect x="400" y="125" width="640" height="115" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="420" y="157" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">Product switch / shared visual language</text><text x="420" y="186" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Mutual funds → /mf     |     Momentum25 → existing / and /chart</text><path d="M720 240L240 305" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M235 297 L240 305 L245 297" fill="none" stroke="#176b55" stroke-width="2"/><path d="M720 240L720 305" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M715 297 L720 305 L725 297" fill="none" stroke="#176b55" stroke-width="2"/><path d="M720 240L1200 305" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M1195 297 L1200 305 L1205 297" fill="none" stroke="#176b55" stroke-width="2"/><rect x="40" y="305" width="400" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="337" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Explore</text><text x="60" y="366" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Discover /mf • Screen /mf/screen • Search exact</text><text x="60" y="389" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">plan-options</text><rect x="520" y="305" width="400" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="540" y="337" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Understand</text><text x="540" y="366" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Fund /mf/funds/:code • Studio /mf/studio • Compare</text><text x="540" y="389" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">/mf/compare</text><rect x="1000" y="305" width="400" height="145" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="1020" y="337" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Test and keep</text><text x="1020" y="366" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Simulate /mf/simulate • Workspace /mf/workspace •</text><text x="1020" y="389" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Decision brief</text><path d="M240 450L240 524" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M235 516 L240 524 L245 516" fill="none" stroke="#176b55" stroke-width="2"/><path d="M720 450L720 524" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M715 516 L720 524 L725 516" fill="none" stroke="#176b55" stroke-width="2"/><path d="M1200 450L1200 524" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M1195 516 L1200 524 L1205 516" fill="none" stroke="#176b55" stroke-width="2"/><rect x="40" y="524" width="400" height="176" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="60" y="556" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">Context travels with the investor</text><text x="60" y="585" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Fund ids, plan/option, revision/method, window,</text><text x="60" y="608" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">filters and return focus. Financial inputs stay out</text><text x="60" y="631" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">of URLs.</text><rect x="520" y="524" width="400" height="176" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="540" y="556" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">Agent, integrated everywhere</text><text x="540" y="585" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Slice 5: ask → validated tools → cited evidence →</text><text x="540" y="608" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">editable view. Conventional controls always remain.</text><rect x="1000" y="524" width="400" height="176" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="1020" y="556" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">Portfolio joins when available</text><text x="1020" y="585" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Slice 6 + enrichment: local CAS, ledger, exposures</text><text x="1020" y="608" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">and allocation scenarios. No transaction placement.</text><rect x="40" y="772" width="650" height="210" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="60" y="804" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Desktop / tablet</text><text x="60" y="833" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Desktop: left rail + search/ask + content + one optional evidence rail. Tablet:</text><text x="60" y="856" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">collapsed rail, filter drawer, overlay evidence.</text><rect x="720" y="772" width="680" height="210" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="740" y="804" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Mobile</text><text x="740" y="833" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Top search/ask; bottom Discover / Screen / Workspace / More. Portfolio replaces Workspace</text><text x="740" y="856" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">after launch. Studio, Compare and Simulate remain in More.</text><text x="40" y="1041" font-family="Inter,Arial,sans-serif" font-size="11" fill="#53675e" font-weight="600">CLIENT COMPOSITION + EXISTING ANALYTICS NOW     /     W1–W3, AGENT, PORTFOLIO AND E1–E7 TRACKED AS DEPENDENCIES</text></svg>