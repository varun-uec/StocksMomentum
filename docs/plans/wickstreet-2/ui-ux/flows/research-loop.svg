<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc"><title id="title">Research journey · evidence to a revisitable decision</title><desc id="desc">Planning wireframe. Frozen v5 reference figures; schematic chart shapes. Planned services explicitly labelled.</desc><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="#d6ded5" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="1200" height="1320" rx="0" fill="#f6f5f0" stroke="#f6f5f0"/><text x="40" y="52" font-family="Georgia,serif" font-size="34" fill="#172d27" font-weight="400">From a question to a considered decision</text><text x="40" y="84" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">J1 / J2 / J3 / J4 / J8 · revision and exact plan identity persist</text><rect x="65" y="121" width="725" height="127" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="85" y="153" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">01  Discover or ask</text><text x="85" y="182" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Choose a purpose-labelled collection or exact plan-option. No mandatory onboarding.</text><path d="M426 248L426 278" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 270 L426 278 L431 270" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="278" width="725" height="127" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="85" y="310" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">02  Screen with transparent rules</text><text x="85" y="339" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Edit filters, inspect missing exclusions and why a row matched. Zero results offer returned</text><text x="85" y="362" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">relaxations.</text><path d="M426 405L426 435" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 427 L426 435 L431 427" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="435" width="725" height="127" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="85" y="467" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">03  Investigate both sides</text><text x="85" y="496" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Performance, downside, recovery, peers, score breakdown and source/method. State what is</text><text x="85" y="519" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">unavailable.</text><path d="M426 562L426 592" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 584 L426 592 L431 584" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="592" width="725" height="127" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="85" y="624" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">04  Compare alternatives</text><text x="85" y="653" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">2–5 plans; common-start curve, distinct trailing windows and paired correlation observations.</text><path d="M426 719L426 749" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 741 L426 749 L431 741" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="749" width="725" height="127" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="85" y="781" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">05  Test the investment habit</text><text x="85" y="810" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Historical dates and cash flows; tax class, rule version, stamp duty, omissions and previous-</text><text x="85" y="833" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">result state.</text><path d="M426 876L426 906" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 898 L426 906 L431 898" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="906" width="725" height="127" rx="12" fill="#e3efe7" stroke="#d6ded5"/><text x="85" y="938" font-family="Inter,Arial,sans-serif" font-size="18" fill="#176b55" font-weight="600">06  Record a decision brief</text><text x="85" y="967" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Keep objective, alternatives, evidence for/against, scenario, doubts and review trigger. W1–W3</text><text x="85" y="990" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">required.</text><path d="M426 1033L426 1063" fill="none" stroke="#176b55" stroke-dasharray=""/><path d="M421 1055 L426 1063 L431 1055" fill="none" stroke="#176b55" stroke-width="2"/><rect x="65" y="1063" width="725" height="127" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="85" y="1095" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">07  Revisit without rewriting history</text><text x="85" y="1124" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Replay original revision or refresh an explicit copy. Compare changes; persist conflict-safe</text><text x="85" y="1147" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">edits.</text><rect x="840" y="121" width="310" height="260" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="860" y="153" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">A failure keeps context</text><text x="860" y="182" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Service error: retain previous view</text><text x="860" y="205" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">with its old label and retry. Missing:</text><text x="860" y="228" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">show NA/NM with reason. No snapshot:</text><text x="860" y="251" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">explain availability.</text><rect x="840" y="419" width="310" height="260" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="860" y="451" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Back returns to research</text><text x="860" y="480" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Restore filter draft semantics, result</text><text x="860" y="503" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">cursor, scroll, focus row, compare</text><text x="860" y="526" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">selection and open disclosure state.</text><rect x="840" y="717" width="310" height="260" rx="12" fill="#ffffff" stroke="#d6ded5"/><text x="860" y="749" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172d27" font-weight="600">Explainability at every step</text><text x="860" y="778" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Value → window → peer/sample → formula</text><text x="860" y="801" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">→ source/date/revision → limitation.</text><text x="860" y="824" font-family="Inter,Arial,sans-serif" font-size="13" fill="#53675e" font-weight="400">Claims never outrun data coverage.</text><text x="65" y="1274" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176b55" font-weight="600">Saving a conclusion or scenario does not execute an investment transaction.</text></svg>